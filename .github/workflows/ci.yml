name: CI

on:
  push:
    branches: [main, master, integration]
    tags: ["v*"]
  pull_request:
    branches: [main, master, integration]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # scikit-build-core invokes CMake and a C++17 compiler at install time.
      # ubuntu-latest ships g++ + cmake; windows-latest ships MSVC + cmake.
      # No extra system setup is required.

      - name: Install package with test extras
        # NOTE: deliberately not editable (`-e`). In scikit-build-core's
        # default editable ("redirect") mode the Python source is imported
        # from src/pvfs_tools/, but CMake-built native libraries live in the
        # build/ directory. pvfs_binding.py loads its DLL/.so from
        # Path(__file__).parent, so under `-e` it would look in the source
        # tree and fail. A regular install also validates exactly what users
        # get from PyPI.
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" -v

      - name: Run tests
        run: pytest -q
