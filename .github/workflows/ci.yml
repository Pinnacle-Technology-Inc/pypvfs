name: CI

on:
  push:
    branches: [main, master, integration]
    tags: ["v*"]
  pull_request:
    branches: [main, master, integration]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # scikit-build-core invokes CMake and a C++17 compiler at install time.
      # ubuntu-latest ships g++ + cmake; windows-latest ships MSVC + cmake.
      # No extra system setup is required.

      - name: Install package (editable) with test extras
        # pip>=23 understands scikit-build-core's editable mode out of the box.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -v

      - name: Run tests
        run: pytest -q
