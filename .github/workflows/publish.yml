# Publish pypvfs to PyPI using trusted publishing (OIDC).
#
# Release flow:
#   1. Bump version in pyproject.toml.
#   2. Tag the commit (e.g. `git tag v1.0.2 && git push origin v1.0.2`).
#   3. This workflow builds platform-specific wheels with cibuildwheel and
#      uploads them to PyPI.
#
# PyPI: enable "Trusted publishing" for this GitHub repo/workflow.
#
# Manual run: Actions -> "Publish to PyPI" -> Run workflow.

name: Publish to PyPI

run-name: "PyPI publish ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Build one wheel per OS. Because pvfs is a ctypes wrapper (no Python ABI),
  # scikit-build-core tags each wheel `py3-none-<plat>` and cibuildwheel only
  # needs to run once per platform.
  # --------------------------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-linux
          - os: windows-latest
            artifact: wheels-windows

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        # All cibuildwheel config (manylinux image, build matrix, smoke test,
        # etc.) lives in [tool.cibuildwheel] inside pyproject.toml.

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl

  # --------------------------------------------------------------------------
  # Sdist is built separately on Linux so users on an unsupported platform
  # can still `pip install pypvfs` (it will compile locally if a C++ toolchain
  # is present).
  # --------------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # --------------------------------------------------------------------------
  # Validate every artifact, then publish via PyPI OIDC trusted publishing.
  # --------------------------------------------------------------------------
  publish:
    name: Upload to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Each wheel job (and the sdist job) uploads under a unique artifact
          # name, so merge them into one flat dist/ for twine.
          merge-multiple: true

      - name: Verify wheels are valid zip files
        run: |
          ls -la dist/
          python << 'PY'
          import glob, pathlib, zipfile, sys
          bad = False
          for path in sorted(glob.glob("dist/*.whl")):
              p = pathlib.Path(path)
              if p.stat().st_size == 0:
                  print("ERROR empty wheel:", path)
                  bad = True
                  continue
              try:
                  with zipfile.ZipFile(path) as z:
                      err = z.testzip()
                      if err:
                          print("ERROR corrupt member", err, "in", path)
                          bad = True
                      else:
                          print("OK", path, p.stat().st_size, "bytes")
              except zipfile.BadZipFile as e:
                  print("ERROR BadZipFile", path, e)
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
