# Publish pypvfs to PyPI using trusted publishing (OIDC). No Twine API token in the repo.
#
# Recommended release flow (same idea as ptech-morelia):
#   1. Bump version in pyproject.toml (and tag e.g. v0.1.1), OR create a GitHub Release from a tag.
#   2. Push the tag — this workflow builds sdist + per-OS wheels and uploads in one job.
#
# PyPI: enable "Trusted publishing" for this GitHub repo (see docs/RELEASE.md).
#
# Manual run: Actions → "Publish to PyPI" → Run workflow (still uses the same tag/ref checkout).

name: Publish to PyPI

run-name: "PyPI publish ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-dists:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dists-${{ matrix.os }}
          path: dist/

  pypi-publish:
    name: Upload to PyPI
    needs: build-dists
    runs-on: ubuntu-latest
    # PyPI OIDC: id-token must be on the job that runs pypa/gh-action-pypi-publish (not only workflow-level).
    # Include contents + actions so this job can download workflow artifacts when permissions are explicit.
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: dists-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
