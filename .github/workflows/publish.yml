# Publish pypvfs to PyPI using trusted publishing (OIDC). No Twine API token in the repo.
#
# Recommended release flow (same idea as ptech-morelia):
#   1. Bump version in pyproject.toml (and tag e.g. v0.1.1), OR create a GitHub Release from a tag.
#   2. Push the tag — this workflow builds sdist + wheel (Ubuntu) and uploads to PyPI.
#
# PyPI: enable "Trusted publishing" for this GitHub repo (see docs/RELEASE.md).
#
# Manual run: Actions → "Publish to PyPI" → Run workflow (still uses the same tag/ref checkout).

name: Publish to PyPI

run-name: "PyPI publish ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Single OS for release artifacts: Linux + Windows matrix can both emit the same
  # `*-py3-none-any.whl` name for data-only native payloads; merging two artifacts then
  # overwrites one wheel and twine can see a truncated/corrupt zip (BadZipFile).
  build-dists:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dists-release
          path: dist/

  pypi-publish:
    name: Upload to PyPI
    needs: build-dists
    runs-on: ubuntu-latest
    # PyPI OIDC: id-token must be on the job that runs pypa/gh-action-pypi-publish (not only workflow-level).
    # Include contents + actions so this job can download workflow artifacts when permissions are explicit.
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dists-release
          path: dist

      - name: Verify wheels are valid zip files
        run: |
          ls -la dist/
          python << 'PY'
          import glob, pathlib, zipfile, sys
          bad = False
          for path in sorted(glob.glob("dist/*.whl")):
              p = pathlib.Path(path)
              if p.stat().st_size == 0:
                  print("ERROR empty wheel:", path)
                  bad = True
                  continue
              try:
                  with zipfile.ZipFile(path) as z:
                      err = z.testzip()
                      if err:
                          print("ERROR corrupt member", err, "in", path)
                          bad = True
                      else:
                          print("OK", path, p.stat().st_size, "bytes")
              except zipfile.BadZipFile as e:
                  print("ERROR BadZipFile", path, e)
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
